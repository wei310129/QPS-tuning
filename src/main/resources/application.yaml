spring:
  application:
    name: QPS-tuning
#  threads:
#    virtual:
#      enabled: true

app:
  redis:
    mode: ${REDIS_MODE:single}
    address: ${REDIS_ADDRESS:redis://127.0.0.1:6379}
    password: ${REDIS_PASSWORD:}
    sentinel:
      master-name: ${REDIS_MASTER_NAME:mymaster}
      addresses: ${REDIS_SENTINEL_ADDRESSES:${REDIS_SENTINEL_ADDRESS:redis://127.0.0.1:26379}}
      password: ${REDIS_SENTINEL_PASSWORD:}
    cluster:
      addresses: ${REDIS_CLUSTER_ADDRESSES:redis://127.0.0.1:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}